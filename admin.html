<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luna Piena | Administración</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f8f0ed;
      color: #60464d;
      font-family: Georgia, serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .panel {
      width: 100%;
      max-width: 420px;
      padding: 36px 26px;
      background: #fffaf7;
      border: 1px solid #e9cbd0;
      border-radius: 24px;
      text-align: center;
    }
    h1 { font-weight: normal; }
    input, button {
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border-radius: 12px;
      font-size: 16px;
    }
    input { border: 1px solid #e9cbd0; }
    button {
      border: none;
      background: #b88996;
      color: white;
      cursor: pointer;
    }
    #mensaje { margin-top: 18px; }
  </style>
</head>
<body>
  <main class="panel">
    <div style="font-size:48px;color:#b88996">☾</div>
    <h1>Luna Piena</h1>
    <p>Panel de administración</p>

    <form id="login">
      <input id="email" type="email"
        placeholder="Correo electrónico"
        autocomplete="username" required>
      <input id="password" type="password"
        placeholder="Contraseña"
        autocomplete="current-password" required>
      <button type="submit">Ingresar ♡</button>
    </form>

    <p id="mensaje" role="status"></p>
    <section id="contenido" hidden>
      <h2>Bienvenida ♡</h2>
      <p>Acceso de administración confirmado.</p>
      <button id="salir">Cerrar sesión</button>
      <hr style="margin: 28px 0; border: 0; border-top: 1px solid #e9cbd0;">

<h2>Crear nueva Gift Card ♡</h2>

<form id="formGiftcard">
  <input id="destinataria" type="text"
    placeholder="Nombre de quien recibe el regalo" required>

  <input id="remitente" type="text"
    placeholder="Nombre de quien lo regala" required>

  <select id="servicioGift" required>
    <option value="">Elegí el servicio</option>
    <option value="Semipermanente">Semipermanente</option>
    <option value="Capping">Capping</option>
    <option value="Soft Gel">Soft Gel</option>
  </select>

  <textarea id="dedicatoria"
    placeholder="Escribí una dedicatoria personalizada"
    rows="4"></textarea>

  <p>Fecha de vencimiento:</p>
  <input id="fechaGift" type="date" required>

  <button type="submit">Crear Gift Card ♡</button>
</form>

<p id="resultadoGift" role="status"></p>
      <hr style="margin:30px 0; border:0; border-top:1px solid #e9cbd0;">

<h2>Mis Gift Cards ♡</h2>

<button type="button" id="verGiftcards">
  Ver mis Gift Cards ♡
</button>

<p id="mensajeListado" role="status"></p>

<div id="listaGiftcards"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl =
      "https://jqojitmrrmjhmcmcczay.supabase.co";
    const supabaseKey =
      "sb_publishable_PgyTZJKdI1D-EJnzAGillQ_b80G5Ddk";

    const db = window.supabase.createClient(
      supabaseUrl, supabaseKey
    );

    const ADMIN_UID =
      "48ffda7f-c4f3-419d-9a7a-ad30a1e9ae37";

    const formulario = document.getElementById("login");
    const mensaje = document.getElementById("mensaje");
    const contenido = document.getElementById("contenido");

    async function mostrarSesion() {
      const { data, error } = await db.auth.getUser();
      const autorizado =
        !error && data.user?.id === ADMIN_UID;

      formulario.hidden = autorizado;
      contenido.hidden = !autorizado;

      if (data.user && !autorizado) {
        await db.auth.signOut();
        mensaje.textContent = "Cuenta no autorizada.";
      } else if (autorizado) {
        mensaje.textContent = "";
      }
    }

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      mensaje.textContent = "Verificando acceso...";

      const email = document.getElementById("email").value;
      const password =
        document.getElementById("password").value;

      const { error } = await db.auth.signInWithPassword({
        email, password
      });

      if (error) {
        mensaje.textContent =
          "No se pudo iniciar sesión. Revisá tus datos.";
        return;
      }

      await mostrarSesion();
    });

    document.getElementById("salir")
      .addEventListener("click", async () => {
        await db.auth.signOut();
        contenido.hidden = true;
        formulario.hidden = false;
        document.getElementById("password").value = "";
        mensaje.textContent = "Sesión cerrada.";
      });
document.getElementById("formGiftcard").addEventListener("submit", async (evento) => {
  evento.preventDefault();

  const resultado = document.getElementById("resultadoGift");
  resultado.textContent = "Creando Gift Card...";

  const { data: usuario, error: errorUsuario } = await db.auth.getUser();

  if (errorUsuario || usuario.user?.id !== ADMIN_UID) {
    resultado.textContent = "No tenés autorización para crear tarjetas.";
    return;
  }

  const tarjeta = {
    nombre_destinataria: document.getElementById("destinataria").value.trim(),
    nombre_remitente: document.getElementById("remitente").value.trim(),
    servicio: document.getElementById("servicioGift").value,
    dedicatoria: document.getElementById("dedicatoria").value.trim(),
    fecha_vencimiento: document.getElementById("fechaGift").value,
    estado: "disponible"
  };

  try {
    const { data, error } = await db
      .from("Gift_cards")
      .insert(tarjeta)
      .select("codigo")
      .single();

    if (error) throw error;

    const enlace = new URL("index.html", window.location.href);
    enlace.searchParams.set("codigo", data.codigo);

    resultado.textContent = "¡Gift Card creada! Enlace: " + enlace.href;

    document.getElementById("formGiftcard").reset();
  } catch (error) {
    resultado.textContent = "No se pudo crear la Gift Card: " + error.message;
  }
});
    mostrarSesion();
  </script>
</body>
</html>
