<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luna Piena Nails | Gift Cards</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f8f0ed;
      color: #60464d;
      font-family: Georgia, serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .tarjeta {
      width: 100%;
      max-width: 420px;
      padding: 48px 26px;
      text-align: center;
      background: #fffaf7;
      border: 1px solid #e9cbd0;
      border-radius: 24px;
      box-shadow: 0 15px 45px #9d737025;
    }

    .luna {
      font-size: 55px;
      color: #b88996;
    }

    h1 {
      font-size: 30px;
      font-weight: normal;
      letter-spacing: 2px;
    }

    .subtitulo {
      color: #b88996;
      letter-spacing: 4px;
      font-size: 13px;
    }

    .mensaje {
      margin: 35px 0;
      font-size: 19px;
      line-height: 1.7;
    }

    button {
      background: #b88996;
      color: white;
      border: none;
      padding: 16px 28px;
      border-radius: 30px;
      font-size: 15px;
      cursor: pointer;
    }

    #regalo {
      display: none;
      margin-top: 28px;
      animation: aparecer 0.8s ease;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="tarjeta">
    <div class="luna">☾</div>
    <h1>Luna Piena</h1>
    <p class="subtitulo">NAILS · GIFT CARD</p>

    <div class="mensaje">
      Hay regalos que se convierten
      en momentos especiales.
      <p>Hoy alguien pensó en vos ♡</p>
    </div>

    <button onclick="abrirRegalo()">
      Descubrí tu regalo ✨
    </button>

    
  <div id="regalo">
  <h2>¡Sorpresa! ♡</h2>
    <h2 id="nombreDestinataria"></h2>
<p id="dedicatoriaRegalo" style="font-style:italic; margin:20px 0; white-space:pre-line;"></p>
  <p>Tenés una experiencia de belleza esperándote.</p>

  <p><strong>Tu regalo:</strong></p>
  <h2 id="servicio">Cargando...</h2>

  <p><strong>Válido hasta:</strong></p>
  <p id="vencimiento">Cargando...</p>

  <a
    href="https://wa.me/5493413364855?text=Hola%21%20Recib%C3%AD%20una%20Gift%20Card%20de%20Luna%20Piena%20Nails%20y%20quisiera%20reservar%20un%20turno."
    target="_blank"
    rel="noopener noreferrer"
    style="display:inline-block; margin-top:20px; padding:14px 20px; background:#b88996; color:white; border-radius:30px; text-decoration:none;"
  >
    Reservá tu turno por WhatsApp ♡
  </a>

  <p style="margin-top:24px;">Con amor, Luna Piena Nails</p>
  </div>
  </main>

  <script>
  const SUPABASE_URL = "https://jqojitmrrmjhmcmcczay.supabase.co";
  const SUPABASE_KEY = "sb_publishable_PgyTZJKdI1D-EJnzAGillQ_b80G5Ddk";

  async function abrirRegalo() {
    const regalo = document.getElementById("regalo");
    const servicio = document.getElementById("servicio");
    const vencimiento = document.getElementById("vencimiento");

    regalo.style.display = "block";

    const codigo = new URLSearchParams(window.location.search).get("codigo");

    if (!codigo) {
      servicio.textContent = "No encontramos el código de tu regalo.";
      vencimiento.textContent = "Revisá el enlace recibido.";
      return;
    }

    try {
      const respuesta = await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/consultar_giftcard`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },
          body: JSON.stringify({ p_codigo: codigo })
        }
      );

      if (!respuesta.ok) {
        throw new Error("Error al consultar Supabase");
      }

      const datos = await respuesta.json();

      if (!datos.length) {
        servicio.textContent = "No encontramos esta Gift Card.";
        vencimiento.textContent = "Consultá con Luna Piena Nails.";
        return;
      }

      servicio.textContent = datos[0].servicio || "Servicio pendiente";

      const fecha = datos[0].fecha_vencimiento;
      if (fecha) {
        const [anio, mes, dia] = fecha.split("-");
        vencimiento.textContent = `${dia}/${mes}/${anio}`;
      } else {
        vencimiento.textContent = "Consultar vencimiento";
      }

    } catch (error) {
      servicio.textContent = "No pudimos cargar tu regalo.";
      vencimiento.textContent = "Intentá nuevamente más tarde.";
    }
  }
      </script>
</body>
</html>
